[project]
name = "bugzilla-mcp"
version = "0.6.0"
description = "MCP server for Bugzilla: search, read, triage and update bugs from AI assistants. Read-only by default."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "bugzilla", "bug-tracking", "model-context-protocol", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Bug Tracking",
]

dependencies = [
    "fastmcp>=4.0.11,<5",
    "python-dotenv",
    "httpx",
]

[project.scripts]
bugzilla-mcp = "bugzilla_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/SanthoshSiddegowda/bugzilla-mcp"
Documentation = "https://github.com/SanthoshSiddegowda/bugzilla-mcp#readme"
Issues = "https://github.com/SanthoshSiddegowda/bugzilla-mcp/issues"
Changelog = "https://github.com/SanthoshSiddegowda/bugzilla-mcp/releases"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bugzilla_mcp"
# The package lives at the repo root, not under src/
module-root = ""
